<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="420" viewBox="0 0 1040 420" role="img" aria-labelledby="ultra-title ultra-desc">
<title id="ultra-title">ProgramBench ultra completion scores</title>
<desc id="ultra-desc">Grouped bars compare Raw Codex and Bello completion percentages for 3 tasks and their macro mean.</desc>
