<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="420" viewBox="0 0 1040 420" role="img" aria-labelledby="xhigh-title xhigh-desc">
<title id="xhigh-title">ProgramBench xhigh completion scores</title>
<desc id="xhigh-desc">Grouped bars compare Raw Codex and Bello completion percentages for 2 tasks and their macro mean.</desc>
<rect width="1040" height="420" fill="#FFFFFF"/>
