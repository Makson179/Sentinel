<text x="48.0" y="399.0" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="start" fill="#5B5B5B">One observed run per task and method; no uncertainty intervals are estimated.</text>
